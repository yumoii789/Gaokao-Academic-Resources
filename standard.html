\":1,\"knowledgePoints\":[\"平面向量的数量积\",\"向量垂直\"],\"tags\":[\"2024\",\"数学\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"数学\"},{\"questionId\":\"std-math-2024-04\",\"content\":\"函数 $f(x)=\\\\\\\\sin 2x \\\\\\\\cos \\\\\\\\dfrac{\\\\\\\\pi}{6} - \\\\\\\\cos 2x \\\\\\\\sin \\\\\\\\dfrac{\\\\\\\\pi}{6}$ 的最小正周期为（ ）\",\"answer\":\"$$\\\\\\\\pi$\",\"analysis\":\"由两角差公式：$f(x)=\\\\\\\\sin\\\\\\\\left(2x-\\\\\\\\dfrac{\\\\\\\\pi}{6}\\\\\\\\right)$，其最小正周期 $T=\\\\\\\\dfrac{2\\\\\\\\pi}{\\\\\\\\omega}=\\\\\\\\dfrac{2\\\\\\\\pi}{2}=\\\\\\\\pi$。\",\"difficulty\":2,\"knowledgePoints\":[\"两角和与差\",\"三角函数的周期\"],\"tags\":[\"2024\",\"数学\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"数学\"},{\"questionId\":\"std-math-2024-05\",\"content\":\"已知等差数列 $\\\\\\\\{a_n\\\\\\\\}$ 满足 $a_2=3$，$a_5=9$，则 $a_{10} = $（ ）\",\"answer\":\"$$19$\",\"analysis\":\"由 $a_5-a_2=3d=6$ 得 $d=2$，$a_1=3-2=1$，故 $a_{10}=1+9\\\\\\\\times2=19$。\",\"difficulty\":1,\"knowledgePoints\":[\"等差数列\",\"通项公式\"],\"tags\":[\"2024\",\"数学\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"数学\"},{\"questionId\":\"std-math-2024-06\",\"content\":\"从 5 名男生和 4 名女生中随机选取 3 人参加志愿服务，则选中的 3 人中恰有 1 名女生的概率为（ ）\",\"answer\":\"$$\\\\\\\\dfrac{10}{21}$\",\"analysis\":\"总取法 $C_9^3=84$；恰 1 名女生：$C_4^1 \\\\\\\\cdot C_5^2=4\\\\\\\\times10=40$。故所求概率 $P=\\\\\\\\dfrac{40}{84}=\\\\\\\\dfrac{10}{21}$。\",\"difficulty\":2,\"knowledgePoints\":[\"古典概型\",\"排列组合\"],\"tags\":[\"2024\",\"数学\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"数学\"},{\"questionId\":\"std-math-2023-02\",\"content\":\"已知双曲线 $\\\\\\\\dfrac{x^2}{a^2} - \\\\\\\\dfrac{y^2}{b^2} = 1$ $(a\u003e0, b\u003e0)$ 的一条渐近线方程为 $y=2x$，且其焦距为 $2\\\\\\\\sqrt{5}$，则双曲线的标准方程为________。\",\"answer\":\"$$\\\\\\\\dfrac{x^2}{1} - \\\\\\\\dfrac{y^2}{4} = 1$\",\"analysis\":\"渐近线 $y=\\\\\\\\dfrac{b}{a}x=2x$ 得 $b=2a$；焦距 $2c=2\\\\\\\\sqrt5$ 得 $c=\\\\\\\\sqrt5$。由 $c^2=a^2+b^2=5a^2=5$ 得 $a=1, b=2$。\",\"difficulty\":3,\"knowledgePoints\":[\"双曲线的标准方程\",\"渐近线\"],\"tags\":[\"2023\",\"数学\",\"填空题\",\"普通高考\"],\"year\":2023,\"subject\":\"数学\"},{\"questionId\":\"std-math-2023-03\",\"content\":\"已知函数 $f(x) = x^3 - 3ax + 1$ 在 $(0,1)$ 上单调递减，则实数 $a$ 的取值范围是________。\",\"answer\":\"$$a \\\\\\\\geq 1$\",\"analysis\":\"$$f'(x)=3x^2-3a$。在 $(0,1)$ 上 $f'(x)\u003c0 \\\\\\\\Leftrightarrow x^2\u003ca$ 对所有 $x\\\\\\\\in(0,1)$ 成立。由于 $x^2\\\\\\\\to 1^-$，需 $a \\\\\\\\geq 1$。\",\"difficulty\":3,\"knowledgePoints\":[\"利用导数研究单调性\",\"恒成立问题\"],\"tags\":[\"2023\",\"数学\",\"填空题\",\"普通高考\"],\"year\":2023,\"subject\":\"数学\"},{\"questionId\":\"std-math-2023-04\",\"content\":\"在正方体 $ABCD-A_1B_1C_1D_1$ 中，棱长为 2，$E$ 为棱 $CC_1$ 的中点，则点 $E$ 到直线 $A_1B$ 的距离为________。\",\"answer\":\"$$\\\\\\\\dfrac{2\\\\\\\\sqrt{6}}{3}$\",\"analysis\":\"以 $D$ 为原点建系：$A_1(2,0,2)$，$B(2,2,0)$，$E(0,2,1)$。$\\\\\\\\overrightarrow{A_1B}=(0,2,-2)$，$\\\\\\\\overrightarrow{A_1E}=(-2,2,-1)$。距离 $d=\\\\\\\\dfrac{|\\\\\\\\overrightarrow{A_1B}\\\\\\\\times\\\\\\\\overrightarrow{A_1E}|}{|\\\\\\\\overrightarrow{A_1B}|}=\\\\\\\\dfrac{4\\\\\\\\sqrt3}{2\\\\\\\\sqrt2}=\\\\\\\\dfrac{2\\\\\\\\sqrt6}{3}$。\",\"difficulty\":3,\"knowledgePoints\":[\"空间向量\",\"点线距离\"],\"tags\":[\"2023\",\"数学\",\"解答题\",\"普通高考\"],\"year\":2023,\"subject\":\"数学\"},{\"questionId\":\"std-math-2024-07\",\"content\":\"已知函数 $f(x) = e^x - ax$ 有极小值 $f(x_0)$，且 $x_0 \u003e 0$，求实数 $a$ 的取值范围，并证明：$f(x_0) \u003c \\\\\\\\dfrac{1}{a}$。\",\"answer\":\"$$a \u003e e$；证明见解析\",\"analysis\":\"$$f'(x)=e^x-a$。有极小值且极小值点 $x_0\u003e0$，需 $a\u003ee$（此时 $x_0=\\\\\\\\ln a\u003e0$）。$f(x_0)=a-a\\\\\\\\ln a$。设 $g(a)=\\\\\\\\dfrac1a-(a-a\\\\\\\\ln a)$，对 $a\u003ee$：$g'(a)=\\\\\\\\ln a - 2$，$g$ 在 $(e^2,+\\\\\\\\infty)$ 递增、$(e,e^2)$ 递减，且 $g(e^2)=\\\\\\\\dfrac{1}{e^2}+e^2-2\u003e0$，故 $g(a)\u003e0$，即 $f(x_0)\u003c\\\\\\\\dfrac1a$。\",\"difficulty\":3,\"knowledgePoints\":[\"导数与极值\",\"不等式证明\",\"分类讨论\"],\"tags\":[\"2024\",\"数学\",\"解答题\",\"普通高考\"],\"year\":2024,\"subject\":\"数学\"},{\"questionId\":\"std-phys-2024-01\",\"content\":\"一物体做匀加速直线运动，初速度为 $4\\\\\\\\ \\\\\\\\mathrm{m/s}$，加速度为 $2\\\\\\\\ \\\\\\\\mathrm{m/s^2}$，则它在前 $3\\\\\\\\ \\\\\\\\mathrm{s}$ 内的位移为（ ）\",\"answer\":\"$$21\\\\\\\\ \\\\\\\\mathrm{m}$\",\"analysis\":\"由位移公式 $x=v_0t+\\\\\\\\dfrac12at^2=4\\\\\\\\times3+\\\\\\\\dfrac12\\\\\\\\times2\\\\\\\\times9=12+9=21\\\\\\\\ \\\\\\\\mathrm{m}$。\",\"difficulty\":1,\"knowledgePoints\":[\"匀变速直线运动\",\"位移公式\"],\"tags\":[\"2024\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2024-02\",\"content\":\"关于万有引力定律，下列说法正确的是（ ）A. 两物体间的引力与质量成正比，与距离成正比  B. 两物体间的引力与距离的平方成反比  C. 引力常量的单位是 $\\\\\\\\mathrm{N \\\\\\\\cdot m^2/kg}$  D. 物体在地球表面附近的重力就是万有引力\",\"answer\":\"B\",\"analysis\":\"A 错：引力与距离的平方成反比。C 错：单位为 $\\\\\\\\mathrm{N \\\\\\\\cdot m^2/kg^2}$。D 错：地表附近的重力是万有引力的一个分量（考虑地球自转时二者略有差异），不能等同。B 正确。\",\"difficulty\":1,\"knowledgePoints\":[\"万有引力定律\",\"单位制\"],\"tags\":[\"2024\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2024-03\",\"content\":\"质量为 $2\\\\\\\\ \\\\\\\\mathrm{kg}$ 的物体在光滑水平面上受到水平恒力 $F=6\\\\\\\\ \\\\\\\\mathrm{N}$ 作用，从静止开始运动 $4\\\\\\\\ \\\\\\\\mathrm{s}$，则该过程中力 $F$ 对物体做的功为（ ）\",\"answer\":\"$$144\\\\\\\\ \\\\\\\\mathrm{J}$\",\"analysis\":\"加速度 $a=F/m=3\\\\\\\\ \\\\\\\\mathrm{m/s^2}$，$4\\\\\\\\ \\\\\\\\mathrm{s}$ 内位移 $x=\\\\\\\\dfrac12at^2=24\\\\\\\\ \\\\\\\\mathrm{m}$，$W=Fx=6\\\\\\\\times24=144\\\\\\\\ \\\\\\\\mathrm{J}$。也可用动能定理：$v=at=12\\\\\\\\ \\\\\\\\mathrm{m/s}$，$W=\\\\\\\\dfrac12mv^2=144\\\\\\\\ \\\\\\\\mathrm{J}$。\",\"difficulty\":2,\"knowledgePoints\":[\"牛顿第二定律\",\"功\",\"动能定理\"],\"tags\":[\"2024\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2023-02\",\"content\":\"一列简谐横波沿 $x$ 轴正方向传播，波速为 $4\\\\\\\\ \\\\\\\\mathrm{m/s}$，波长 $\\\\\\\\lambda = 8\\\\\\\\ \\\\\\\\mathrm{m}$。波源起振方向向上，则平衡位置处的质点 $P$ 从开始振动起第一次到达波谷所需的时间为（ ）\",\"answer\":\"$$1.5\\\\\\\\ \\\\\\\\mathrm{s}$\",\"analysis\":\"周期 $T=\\\\\\\\dfrac{\\\\\\\\lambda}{v}=2\\\\\\\\ \\\\\\\\mathrm{s}$。质点起振方向与波源相同（向上），先到波峰再回平衡位置再到波谷，需 $\\\\\\\\dfrac{3}{4}T=1.5\\\\\\\\ \\\\\\\\mathrm{s}$。\",\"difficulty\":2,\"knowledgePoints\":[\"机械波的传播\",\"周期与波速\"],\"tags\":[\"2023\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2023,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2024-04\",\"content\":\"真空中两点电荷 $+Q$ 与 $-Q$ 相距 $2d$，则两电荷连线中点处的电场强度大小为（ ）\",\"answer\":\"$$\\\\\\\\dfrac{2kQ}{d^2}$\",\"analysis\":\"两点电荷在中点产生的场强方向均由 $+Q$ 指向 $-Q$，各自大小 $E=\\\\\\\\dfrac{kQ}{d^2}$，叠加得 $E_{total}=\\\\\\\\dfrac{2kQ}{d^2}$。\",\"difficulty\":2,\"knowledgePoints\":[\"电场强度的叠加\",\"点电荷场强\"],\"tags\":[\"2024\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2024-05\",\"content\":\"闭合线圈在匀强磁场中绕垂直于磁场的轴匀速转动，产生正弦交流电。若线圈转速加倍，则感应电动势的最大值将（ ）A. 不变  B. 加倍  C. 变为 4 倍  D. 减半\",\"answer\":\"B\",\"analysis\":\"$$E_m=NBS\\\\\\\\omega$，转速加倍则角速度 $\\\\\\\\omega$ 加倍，故 $E_m$ 加倍。\",\"difficulty\":1,\"knowledgePoints\":[\"交变电流\",\"最大值与转速关系\"],\"tags\":[\"2024\",\"物理\",\"选择题\",\"普通高考\"],\"year\":2024,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2023-03\",\"content\":\"一定质量的理想气体从状态 $A$ 等温膨胀到状态 $B$，再从 $B$ 等容降温到状态 $C$。已知 $T_A = 300\\\\\\\\ \\\\\\\\mathrm{K}$，$V_A = 2\\\\\\\\ \\\\\\\\mathrm{L}$，$V_B = 6\\\\\\\\ \\\\\\\\mathrm{L}$，状态 $A$ 的压强 $p_A = 9.0 \\\\\\\\times 10^5\\\\\\\\ \\\\\\\\mathrm{Pa}$。求：气体在状态 $B$ 的压强 $p_B$。\",\"answer\":\"$$p_B = 3.0 \\\\\\\\times 10^5\\\\\\\\ \\\\\\\\mathrm{Pa}$\",\"analysis\":\"$$A \\\\\\\\to B$ 为等温过程，由玻意耳定律 $p_A V_A = p_B V_B$，得 $p_B = \\\\\\\\dfrac{p_A V_A}{V_B} = \\\\\\\\dfrac{9.0\\\\\\\\times10^5 \\\\\\\\times 2}{6} = 3.0\\\\\\\\times10^5\\\\\\\\ \\\\\\\\mathrm{Pa}$。\",\"difficulty\":3,\"knowledgePoints\":[\"理想气体状态方程\",\"等温过程\"],\"tags\":[\"2023\",\"物理\",\"计算题\",\"普通高考\"],\"year\":2023,\"subject\":\"物理\"},{\"questionId\":\"std-phys-2024-06\",\"content\":\"氢原子从 $n=4$ 的能级跃迁到 $n=2$ 的能级，辐射出的光子能量为________ $\\\\\\\\mathrm{eV}$。（已知 $E_2=-3.4\\\\\\\\ \\\\\\\\mathrm{eV}$，$E_4=-0.85\\\\\\\\ \\\\\\\\mathrm{eV}$）\",\"answer\":\"$$2.55$\",\"analysis\":\"辐射光子能量 $h\\\\\\\\nu = E_4 - E_2 = -0.85-(-3.4)=2.55\\\\\\\\ \\\\\\\\mathrm{eV}$。\",\"difficulty\":1,\"knowledgePoints\":[\"玻尔模型\",\"能级跃迁\"],\"tags\":[\"2024\",\"物理\"
